    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>\n<\u002Fsc-if>\n<\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n<sc-if value=\"{{ isMomo }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;gap:12px\">\n<div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px\">\n<label for=\"network\" style=\"font-size:12px;line-height:16px;font-weight:700;letter-spacing:.5px\">Network<\u002Flabel>\n<sc-raw-select id=\"network\" class=\"input\" value=\"{{ network }}\" sc-camel-on-change=\"{{ onNetwork }}\">\n<option value=\"MTN Mobile Money\">MTN Mobile Money<\u002Foption>\n<option value=\"Airtel Money\">Airtel Money<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px\">\n<label for=\"phone\" style=\"font-size:12px;line-height:16px;font-weight:700;letter-spacing:.5px\">Phone number<\u002Flabel>\n<input id=\"phone\" class=\"input\" type=\"text\" inputmode=\"tel\" placeholder=\"07XX XXX XXX\" value=\"{{ phone }}\" aria-invalid=\"{{ phoneInvalid }}\" sc-camel-on-change=\"{{ onPhone }}\">\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ hasPhoneError }}\" hint-placeholder-val=\"{{ false }}\">\n<p role=\"alert\" style=\"margin:0;display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:700;color:#ba1a1a\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v6M12 16.5v.5\"><\u002Fpath><\u002Fsvg>\n<span>Error: enter a 10-digit number that starts with 07.<\u002Fspan>\n<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ isTill }}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin:0;padding:12px 16px;border-radius:8px;background:#e4dbc4;font-size:14px;line-height:20px;letter-spacing:.25px\">Pay the cashier with cash or mobile money when you are ready to leave. Quote your order number.<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fdiv>\n<div style=\"flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n<button type=\"button\" class=\"btn btn-tonal\" sc-camel-on-click=\"{{ backToMenu }}\">Back to menu<\u002Fbutton>\n<button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ send }}\" style=\"min-width:320px\">{{ sendLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ onDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"height:728px;box-sizing:border-box;padding:32px 48px;display:flex;gap:48px\">\n<div style=\"flex:1.2 1 0;min-width:0;display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;align-items:center;gap:16px\">\n<span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#45644a;color:#ffffff\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<div>\n<h1 style=\"margin:0;font-size:36px;line-height:44px;font-weight:400\">Order sent to the kitchen<\u002Fh1>\n<p style=\"margin:0;font-size:16px;line-height:24px;letter-spacing:.5px;color:#45644a\">{{ orderNo }} · {{ tableLabel }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol aria-label=\"Order status\" style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ tracker }}\" as=\"k\" hint-placeholder-count=\"3\">\n<li aria-current=\"{{ k.aria }}\" style=\"display:flex;align-items:center;gap:16px;min-height:72px;box-sizing:border-box;padding:8px 16px;border-radius:8px;background:{{ k.bg }};color:{{ k.fg }}\">\n<span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:2px solid currentColor;font-size:14px;font-weight:700\">{{ k.num }}<\u002Fspan>\n<span style=\"display:flex;flex-direction:column;flex-grow:1;min-width:0\">\n<span style=\"font-size:16px;line-height:24px;font-weight:700;letter-spacing:.15px\">{{ k.label }}<\u002Fspan>\n<span style=\"font-size:12px;line-height:16px;letter-spacing:.4px\">{{ k.hint }}<\u002Fspan>\n<\u002Fspan>\n<span class=\"chip\" style=\"background:{{ k.chipBg }};color:{{ k.chipFg }}\">{{ k.state }}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<p style=\"margin:0;padding:12px 16px;border-radius:8px;background:#e4dbc4;font-size:14px;line-height:20px;letter-spacing:.25px\">{{ payNote }}<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:auto\">\n<button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ reset }}\">Start a new order<\u002Fbutton>\n<button type=\"button\" class=\"btn btn-tonal btn-sm\" sc-camel-on-click=\"{{ advance }}\" disabled=\"{{ atEnd }}\">Prototype only: move the order along<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<section style=\"flex:1 1 0;min-width:0;box-sizing:border-box;border:1px solid #e4dbc4;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<h2 style=\"margin:0;font-size:24px;line-height:32px;font-weight:400\">Your order<\u002Fh2>\n<div style=\"flex:1 1 auto;min-height:0;overflow-y:auto\">\n<sc-for list=\"{{ summary }}\" as=\"s\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e4dbc4;font-size:14px;line-height:20px;letter-spacing:.25px\">\n<span style=\"min-width:0\">{{ s.text }}<\u002Fspan>\n<span style=\"flex:none;font-weight:700;font-variant-numeric:tabular-nums\">{{ s.sub }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ hasNotes }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:12px 0 0;font-size:12px;line-height:16px;letter-spacing:.4px;color:#45644a\">Kitchen note: {{ notes }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid #45644a\">\n<span style=\"font-size:16px;line-height:24px;font-weight:700\">Total<\u002Fspan>\n<span style=\"font-size:24px;line-height:32px;font-weight:700;font-variant-numeric:tabular-nums\">{{ totalText }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = this.initial();\n  }\n  initial() {\n    return {\n      screen: 'start',\n      table: null,\n      guestName: '',\n      cat: 'Mains',\n      lines: [],\n      notes: '',\n      pay: 'till',\n      network: 'MTN Mobile Money',\n      phone: '',\n      tried: false,\n      step: 0,\n      toast: ''\n    };\n  }\n  addItem(id) {\n    this.setState((st) => {\n      const lines = st.lines.slice();\n      const i = lines.findIndex((l) => l.id === id);\n      if (i >= 0) lines[i] = Object.assign({}, lines[i], { qty: lines[i].qty + 1 });\n      else lines.push({ id: id, qty: 1 });\n      return { lines: lines };\n    });\n  }\n  changeQty(id, d) {\n    this.setState((st) => {\n      const lines = st.lines\n        .map((l) => (l.id === id ? Object.assign({}, l, { qty: l.qty + d }) : l))\n        .filter((l) => l.qty > 0);\n      const back = lines.length === 0 && st.screen === 'review';\n      return { lines: lines, screen: back ? 'menu' : st.screen };\n    });\n  }\n  send() {\n    const st = this.state;\n    if (st.lines.length === 0) return;\n    if (st.pay === 'momo') {\n      const digits = st.phone.replace(/\\s+/g, '');\n      if (!/^07[0-9]{8}$/.test(digits)) { this.setState({ tried: true }); return; }\n    }\n    this.setState({ screen: 'done', step: 0, tried: false, toast: '' });\n  }\n  renderVals() {\n    // Image field: map a menu item id to a photo URL, e.g. IMG.rolex = 'https://.../rolex.jpg'.\n    // Items without one show a generated placeholder (plate + initials).\n    const IMG = {};\n    const art = (name) => {\n      const ini = name.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');\n      const svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"240\" height=\"96\" viewBox=\"0 0 240 96\"><rect width=\"240\" height=\"96\" fill=\"#f0e9dd\"/><circle cx=\"120\" cy=\"48\" r=\"38\" fill=\"#e4dbc4\" stroke=\"#45644a\" stroke-width=\"2\"/><circle cx=\"120\" cy=\"48\" r=\"26\" fill=\"none\" stroke=\"#45644a\" stroke-width=\"1\" opacity=\".5\"/><text x=\"120\" y=\"56\" text-anchor=\"middle\" font-family=\"Lato,sans-serif\" font-size=\"24\" font-weight=\"700\" fill=\"#18442a\">' + ini + '<\u002Ftext><\u002Fsvg>';\n      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);\n    };\n    const MENU = [\n      { id: 'matoke', name: 'Matoke & Beef Stew', cat: 'Mains', price: 18000, desc: 'Steamed green banana with beef stew', avail: true },\n      { id: 'luwombo', name: 'Chicken Luwombo', cat: 'Mains', price: 25000, desc: 'Chicken steamed in banana leaves', avail: true },\n      { id: 'tilapia', name: 'Fried Tilapia & Chips', cat: 'Mains', price: 32000, desc: 'Whole fried tilapia served with chips', avail: true },\n      { id: 'pilau', name: 'Pilau Beef', cat: 'Mains', price: 20000, desc: 'Spiced rice cooked with beef', avail: true },\n      { id: 'ribs', name: 'Grilled Goat Ribs', cat: 'Mains', price: 28000, desc: 'Charcoal-grilled goat ribs', avail: false },\n      { id: 'rolex', name: 'Rolex', cat: 'Snacks', price: 5000, desc: 'Chapati rolled with fried egg and vegetables', avail: true },\n      { id: 'samosa', name: 'Samosas (2)', cat: 'Snacks', price: 3000, desc: 'Two crisp spiced pastries', avail: true },\n      { id: 'kikomando', name: 'Kikomando', cat: 'Snacks', price: 4000, desc: 'Chopped chapati with beans', avail: true },\n      { id: 'chapati', name: 'Chapati', cat: 'Sides', price: 2000, desc: 'Soft pan-fried flatbread', avail: true },\n      { id: 'rice', name: 'Steamed Rice', cat: 'Sides', price: 5000, desc: 'Plain steamed rice', avail: true },\n      { id: 'kachumbari', name: 'Kachumbari Salad', cat: 'Sides', price: 4000, desc: 'Tomato, onion and chilli', avail: true },\n      { id: 'passion', name: 'Passion Juice', cat: 'Drinks', price: 6000, desc: 'Fresh passion fruit juice', avail: true },\n      { id: 'mango', name: 'Mango Juice', cat: 'Drinks', price: 6000, desc: 'Fresh mango juice', avail: true },\n      { id: 'soda', name: 'Soda 300ml', cat: 'Drinks', price: 3000, desc: 'Chilled bottled soda', avail: true },\n      { id: 'water', name: 'Mineral Water 500ml', cat: 'Drinks', price: 2000, desc: 'Still bottled water', avail: true },\n      { id: 'tea', name: 'Ugandan Tea', cat: 'Drinks', price: 3000, desc: 'Black tea with milk', avail: true },\n      { id: 'fruit', name: 'Fruit Platter', cat: 'Desserts', price: 8000, desc: 'Seasonal fresh fruit', avail: true }\n    ];\n    const SEATS = [2, 2, 4, 4, 4, 4, 6, 6, 2, 8, 4, 4];\n    const BUSY = { 2: true, 3: true, 4: true, 5: true, 7: true, 9: true, 11: true };\n    const s = this.state;\n    const fmt = (n) => 'UGX ' + n.toLocaleString('en-US');\n    const num = (n) => n.toLocaleString('en-US');\n    const byId = {};\n    MENU.forEach((m) => { byId[m.id] = m; });\n    const total = s.lines.reduce((sum, l) => sum + l.qty * byId[l.id].price, 0);\n    const tableLabel = s.table ? 'Table ' + s.table : 'No table chosen';\n    const orderFor = s.guestName.trim() ? tableLabel + ' · ' + s.guestName.trim() : tableLabel;\n\n    const stepNames = ['Table', 'Menu', 'Review', 'Done'];\n    const stepIndex = { start: 0, menu: 1, review: 2, done: 3 }[s.screen];\n    const steps = stepNames.map((label, i) => {\n      const on = i === stepIndex;\n      const done = i < stepIndex;\n      return {\n        label: label,\n        num: String(i + 1),\n        aria: on ? 'step' : 'false',\n        ariaLabel: 'Step ' + (i + 1) + ' of 4, ' + label + (done ? ', completed' : on ? ', current' : ', upcoming'),\n        hasConn: i > 0,\n        connBg: i <= stepIndex ? '#e4dbc4' : '#45644a',\n        done: done,\n        notDone: !done,\n        dotBg: done ? '#e4dbc4' : on ? '#e4dbc4' : 'transparent',\n        dotBorder: done || on ? '#e4dbc4' : '#a9b8a6',\n        dotFg: done || on ? '#18442a' : '#f3ede3',\n        fg: on || done ? '#f3ede3' : '#c9d3c5',\n        weight: on ? '700' : '400'\n      };\n    });\n\n    const tables = SEATS.map((seats, i) => {\n      const n = i + 1;\n      const busy = !!BUSY[n];\n      const on = s.table === n;\n      return {\n        label: 'T' + n,\n        sub: busy ? 'In use' : seats + ' seats',\n        busy: busy,\n        pressed: on ? 'true' : 'false',\n        aria: 'Table ' + n + (busy ? ', in use' : ', ' + seats + ' seats'),\n        bg: on ? '#45644a' : busy ? '#f3ede3' : '#e4dbc4',\n        fg: on ? '#ffffff' : busy ? '#45644a' : '#18442a',\n        border: busy ? '1px dashed #45644a' : '1px solid transparent',\n        cursor: busy ? 'not-allowed' : 'pointer',\n        pick: () => this.setState({ table: n })\n      };\n    });\n\n    const catNames = ['Mains', 'Snacks', 'Sides', 'Drinks', 'Desserts'];\n    const cats = catNames.map((c) => {\n      const on = s.cat === c;\n      return { label: c, pressed: on ? 'true' : 'false', bg: on ? '#45644a' : '#e4dbc4', fg: on ? '#ffffff' : '#18442a', pick: () => this.setState({ cat: c }) };\n    });\n\n    const items = MENU.filter((m) => m.cat === s.cat).map((m) => {\n      const found = s.lines.find((l) => l.id === m.id);\n      const q = found ? found.qty : 0;\n      return {\n        name: m.name,\n        desc: m.desc,\n        img: IMG[m.id] || art(m.name),\n        imgOpacity: m.avail ? '1' : '0.5',\n        priceText: fmt(m.price),\n        soldOut: !m.avail,\n        canAdd: m.avail,\n        inCart: q > 0,\n        qtyText: '×' + q,\n        bg: m.avail ? '#e4dbc4' : '#f3ede3',\n        border: m.avail ? '1px solid transparent' : '1px dashed #45644a',\n        cursor: m.avail ? 'pointer' : 'not-allowed',\n        aria: m.avail ? 'Add ' + m.name + ', ' + fmt(m.price) : m.name + ', sold out',\n        add: () => this.addItem(m.id)\n      };\n    });\n\n    const lines = s.lines.map((l) => {\n      const m = byId[l.id];\n      return {\n        name: m.name,\n        qty: l.qty,\n        calc: l.qty + ' × ' + fmt(m.price),\n        sub: fmt(l.qty * m.price),\n        subNum: num(l.qty * m.price),\n        decAria: 'Remove one ' + m.name,\n        incAria: 'Add one ' + m.name,\n        dec: () => this.changeQty(l.id, -1),\n        inc: () => this.changeQty(l.id, 1)\n      };\n    });\n    const summary = s.lines.map((l) => ({ text: l.qty + ' × ' + byId[l.id].name, sub: fmt(l.qty * byId[l.id].price) }));\n\n    const PAY = [\n      { key: 'till', label: 'At the till', hint: 'Cash or mobile money with the cashier' },\n      { key: 'momo', label: 'Mobile money now', hint: 'MTN or Airtel, from your phone' }\n    ];\n    const payOptions = PAY.map((p) => {\n      const on = s.pay === p.key;\n      return {\n        key: p.key, label: p.label, hint: p.hint, checked: on,\n        bg: on ? '#45644a' : '#e4dbc4',\n        fg: on ? '#ffffff' : '#18442a',\n        sub: on ? '#ffffff' : '#45644a',\n        pick: () => this.setState({ pay: p.key, tried: false })\n      };\n    });\n    const digits = s.phone.replace(/\\s+/g, '');\n    const phoneOk = /^07[0-9]{8}$/.test(digits);\n    const phoneErr = s.tried && !phoneOk;\n\n    const TRACK = [\n      { label: 'Pending', hint: 'The kitchen has your order' },\n      { label: 'Preparing', hint: 'Your food is being cooked' },\n      { label: 'Served', hint: 'A waiter has brought it to your table' }\n    ];\n    const tracker = TRACK.map((k, i) => {\n      const done = i < s.step;\n      const current = i === s.step;\n      return {\n        num: done ? '✓' : String(i + 1),\n        label: k.label,\n        hint: k.hint,\n        aria: current ? 'step' : 'false',\n        bg: current ? '#45644a' : done ? '#18442a' : '#e4dbc4',\n        fg: current || done ? '#ffffff' : '#18442a',\n        state: current ? 'Now' : done ? 'Done' : 'Next',\n        chipBg: current || done ? '#ffffff' : '#f3ede3',\n        chipFg: '#18442a'\n      };\n    });\n\n    const orderNo = 'ORD-1047';\n    const payNote = s.pay === 'till'\n      ? 'Pay at the till when you are ready. Quote ' + orderNo + ' to the cashier.'\n      : 'A payment request for ' + fmt(total) + ' was sent to ' + (s.phone.trim() || 'your phone') + ' on ' + s.network + '. Approve it on your phone.';\n\n    const startHint = s.table ? 'Table ' + s.table + ' selected.' : 'Choose a table to continue.';\n\n    return {\n      steps, tables, cats, items, lines, summary, payOptions, tracker,\n      onStart: s.screen === 'start',\n      onMenu: s.screen === 'menu',\n      onReview: s.screen === 'review',\n      onDone: s.screen === 'done',\n      hasToast: !!s.toast,\n      toast: s.toast,\n      guestName: s.guestName,\n      cannotStart: !s.table,\n      startHint: startHint,\n      catTitle: s.cat,\n      tableLabel: tableLabel,\n      orderFor: orderFor,\n      noLines: s.lines.length === 0,\n      totalText: fmt(total),\n      notes: s.notes,\n      hasNotes: s.notes.trim().length > 0,\n      isMomo: s.pay === 'momo',\n      isTill: s.pay === 'till',\n      network: s.network,\n      phone: s.phone,\n      phoneInvalid: phoneErr ? 'true' : 'false',\n      hasPhoneError: phoneErr,\n      sendLabel: 'Send to kitchen · ' + fmt(total),\n      orderNo: orderNo,\n      payNote: payNote,\n      atEnd: s.step >= 2,\n      onName: (e) => this.setState({ guestName: e.target.value }),\n      onNotes: (e) => this.setState({ notes: e.target.value }),\n      onNetwork: (e) => this.setState({ network: e.target.value }),\n      onPhone: (e) => this.setState({ phone: e.target.value, tried: false }),\n      startOrder: () => { if (this.state.table) this.setState({ screen: 'menu' }); },\n      changeTable: () => this.setState({ screen: 'start' }),\n      toReview: () => { if (this.state.lines.length) this.setState({ screen: 'review', tried: false }); },\n      backToMenu: () => this.setState({ screen: 'menu' }),\n      send: () => this.send(),\n      advance: () => this.setState((st) => ({ step: Math.min(2, st.step + 1) })),\n      reset: () => this.setState(this.initial()),\n      callWaiter: () => {\n        const t = this.state.table;\n        this.setState({ toast: t ? 'A waiter is on the way to Table ' + t + '.' : 'A waiter is on the way.' });\n        setTimeout(() => this.setState({ toast: '' }), 4000);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
