repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The mock-ups are generated bundles; keep them byte-identical to the originals.
      - id: trailing-whitespace
        exclude: ^docs/design/.*\.html$
      - id: end-of-file-fixer
        exclude: ^docs/design/.*\.html$
      - id: check-yaml
      - id: check-added-large-files

  # For the Python/Django side
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
